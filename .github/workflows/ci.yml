name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DevelopmentProject.sln

      - name: Build
        run: dotnet build DevelopmentProject.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test DevProject.Tests/DevProject.Tests.csproj --no-build --configuration Release --verbosity normal

  frontend:
    name: Angular Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: DevProjectUI/package-lock.json

      - name: Install dependencies
        working-directory: DevProjectUI
        run: npm ci

      - name: Build
        working-directory: DevProjectUI
        run: npm run build
